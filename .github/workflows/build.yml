# YiCAD CI Build Workflow
#
# Builds and tests YiCAD on Windows x64 with MSVC 2022 (Release only).
# Uses Conan 2 prebuilt packages. The DXF plugin builds its bundled libdxfrw
# source as a static library linked into the plugin DLL.
#
# GoogleTest is the one Conan package this workflow builds locally
# (--build="gtest/*"): ConanCenter has no prebuilt binary for msvc 194 with
# cppstd=23. Once build-deps.yml has published it to the yicax remote this
# becomes a cache hit. All other packages still come prebuilt.
#
# Layering: each layer (base/ -> model/ -> render/ -> application/ -> ui/ ->
# extensions -> shell/) is its own library, so CMake include paths stop a lower
# layer, or an extension, from including a higher one. The pre-build static
# check covers what CMake cannot: header names are unique, and application/
# outside application/view/ does not include the interactive view
# (tools/check_layering.py).
#
# Unit tests run via ctest after the build. test_render needs Mesa's software
# OpenGL, fetched by tools/fetch_mesa.py right before the tests.
#
# Post-install scanning checks for:
#   - DLL completeness
#   - License file presence
#   - Unauthorized SHX/PAT/LIN resources
#   - Absolute path leaks
#   - Credential leaks
#
# Release publishing runs only for v* tags.

name: Build and Test

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.0'
  QT_ARCH: 'win64_msvc2022_64'
  # The tools/ scripts print Chinese; the runner's console encoding is cp1252,
  # so Python would fail with UnicodeEncodeError without UTF-8 mode.
  PYTHONUTF8: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Build (Release only)
  # ---------------------------------------------------------------------------
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.x'

      - name: Install Conan
        run: pip install conan

      # install-qt-action 装好后设置 QT_ROOT_DIR（Qt 安装前缀），下面的步骤都用它
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: ${{ env.QT_ARCH }}
          dir: '${{ github.workspace }}/qt'
          setup-python: false

      - name: Cache SARibbonBar
        id: cache-saribbon
        uses: actions/cache@v5
        with:
          path: external/SARibbonBar/install
          key: saribbonbar-b5d3818-qt${{ env.QT_VERSION }}-win64-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Build SARibbonBar (if not cached)
        if: steps.cache-saribbon.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/czyt1988/SARibbon.git external/SARibbonBar
          git -C external/SARibbonBar checkout b5d3818
          cmake -G "Visual Studio 17 2022" -A x64 -S external/SARibbonBar -B external/SARibbonBar/build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build external/SARibbonBar/build --config Release
          cmake --install external/SARibbonBar/build --config Release --prefix external/SARibbonBar/install

      - name: Cache CDT
        id: cache-cdt
        uses: actions/cache@v5
        with:
          path: external/CDT/install
          key: cdt-1.4.4-win64-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Build CDT (if not cached)
        if: steps.cache-cdt.outputs.cache-hit != 'true'
        run: |
          git clone --branch 1.4.4 --depth 1 https://github.com/artem-ogre/CDT.git external/CDT
          cmake -G "Visual Studio 17 2022" -A x64 -S external/CDT/CDT -B external/CDT/build -DCDT_USE_AS_COMPILED_LIBRARY=ON -DCDT_NO_DEMANGLE=ON
          cmake --build external/CDT/build --config Release
          cmake --install external/CDT/build --config Release --prefix external/CDT/install

      - name: Install Conan dependencies
        run: |
          conan profile detect
          conan install . --output-folder=build/conan-release --profile=profiles/windows-msvc-release --build="gtest/*" --lockfile=conan.lock

      - name: Check layering rules CMake cannot enforce
        run: python tools/check_layering.py

      - name: Configure CMake
        run: cmake -G "Visual Studio 17 2022" -A x64 -S . -B build/Release -DCMAKE_TOOLCHAIN_FILE="build/conan-release/build/generators/conan_toolchain.cmake" -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};${{ github.workspace }}/external/SARibbonBar/install;${{ github.workspace }}/external/CDT/install" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/package/Release"

      - name: Build
        # -m: MSBuild solution-level parallelism. The core is a chain of
        # libraries (YiCadBase -> YiCadModel -> YiCadRender -> YiCadApplication
        # -> YiCadUi -> YiCadShell, doc/LAYER_RESTRUCTURE_PLAN.md), which the
        # Visual Studio generator builds in dependency order; without -m each
        # stage under-uses available cores. See
        # doc/ARCHITECTURE_EVOLUTION_PLAN.md 6.7 and tools/measure_build.ps1.
        run: cmake --build build/Release --config Release -- -m

      # test_render draws reference drawings with Mesa's software OpenGL (llvmpipe)
      # and compares them with committed baseline images; the runner has no GPU,
      # and llvmpipe gives the same pixels on every machine (doc/RENDER_PLAN.md D9).
      # The Mesa version and checksum are pinned in the script; it extracts only
      # opengl32.dll and libgallium_wgl.dll to external/mesa/x64 with 7-Zip.
      - name: Cache Mesa
        uses: actions/cache@v5
        with:
          path: external/mesa
          key: mesa-${{ hashFiles('tools/fetch_mesa.py') }}

      - name: Fetch Mesa (software OpenGL for test_render)
        run: python tools/fetch_mesa.py

      - name: Test
        run: ctest --test-dir build/Release -C Release --output-on-failure

      # On a render mismatch test_render writes <case>.actual.png and <case>.diff.png here
      - name: Upload render test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-test-output
          path: build/Release/tests/render/output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install
        run: cmake --install build/Release --config Release

      - name: Upload licenses
        uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: build/package/Release/bin/licenses/
          retention-days: 90

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          Compress-Archive -Path build/package/Release/bin/* -DestinationPath "YiCAD-${version}-win64.zip"
          Write-Host "Package: YiCAD-${version}-win64.zip"

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: YiCAD-*-win64.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release publishing
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/YiCAD-*-win64.zip
          generate_release_notes: true
